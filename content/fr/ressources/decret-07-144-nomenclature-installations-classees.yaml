title: Nomenclature des installations classées
officialTitle: Décret exécutif n° 07-144 du 19 mai 2007 fixant la nomenclature des installations classées pour la protection de l'environnement (JO n° 34 du 22 mai 2007)
summary: 'La liste des activités classées : à chaque rubrique correspondent des seuils (capacité, puissance, quantité stockée), le régime applicable, donc l''autorité compétente et les études à produire, et le rayon d''affichage de l''enquête publique.'
homeLine: Attribue une rubrique à chaque activité, fixe les seuils qui déterminent le régime et l'autorité compétente, et le rayon d'affichage de l'enquête publique.
