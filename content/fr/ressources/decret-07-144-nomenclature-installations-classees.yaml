title: Nomenclature des installations classées
officialTitle: Décret exécutif n° 07-144 du 19 mai 2007 fixant la nomenclature des installations classées pour la protection de l'environnement (JO n° 34 du 22 mai 2007)
summary: 'La liste des activités classées : pour chaque rubrique, le régime d''autorisation ou de déclaration, le rayon d''affichage de l''enquête publique et les documents exigés (étude d''impact, étude de danger, notice d''impact, rapport sur les produits dangereux).'
homeLine: Attribue une rubrique à chaque activité et fixe, pour chacune, le régime (autorisation ministérielle, du wali, de l'APC ou déclaration), le rayon d'affichage de l'enquête publique et les études exigées.
