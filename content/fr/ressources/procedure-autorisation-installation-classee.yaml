metaTitle: 'Autorisation d''une installation classée en Algérie : la procédure étape par étape'
metaDescription: 'Guide pratique : classement selon la nomenclature, études exigées, dépôt du dossier à la wilaya, enquête publique de 15 jours, décision sous 4 mois, obligations en exploitation. Délais réglementaires et erreurs qui coûtent des mois.'
