title: Obtenir l'autorisation d'une installation classée, étape par étape
officialTitle: 'Guide de procédure : de la nomenclature à l''autorisation d''exploitation, d''après les décrets 07-144, 07-145, 06-198, 23-324 et 25-63 et l''arrêté interministériel du 14 septembre 2014'
summary: De la lecture de la nomenclature à l'arrêté d'autorisation d'exploitation, les six étapes du parcours réglementaire d'un projet industriel en Algérie, avec les délais fixés par les textes et ce qui fait gagner ou perdre des mois.
homeLine: ''
