title: Obtenir l'autorisation d'une installation classée, étape par étape
officialTitle: 'Guide de procédure : de la nomenclature à l''autorisation d''exploitation'
summary: De la lecture de la nomenclature à l'arrêté d'autorisation, les six étapes du parcours réglementaire d'un projet industriel en Algérie, avec les délais fixés par les textes et ce qui fait gagner ou perdre des mois.
homeLine: ''
meta:
