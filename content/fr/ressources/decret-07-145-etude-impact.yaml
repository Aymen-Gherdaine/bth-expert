title: Études et notices d'impact sur l'environnement
officialTitle: Décret exécutif n° 07-145 du 19 mai 2007 déterminant le champ d'application, le contenu et les modalités d'approbation des études et des notices d'impact sur l'environnement (JO n° 34 du 22 mai 2007), modifié et complété par le décret exécutif n° 18-255 du 9 octobre 2018 (JO n° 62 du 17 octobre 2018) et le décret exécutif n° 19-241 du 8 septembre 2019 (JO n° 54 du 8 septembre 2019)
summary: 'Le texte qui dit si votre projet relève d''une étude d''impact ou d''une notice d''impact, ce que le rapport doit contenir, comment la wilaya l''instruit (dépôt, examen, enquête publique de quinze jours, avis des services) et qui l''approuve : le ministre pour l''étude, le wali pour la notice.'
homeLine: 'Fixe les projets soumis à étude ou à notice d''impact, le contenu du rapport et son instruction : dépôt auprès du wali, examen sous un mois, enquête publique de quinze jours, approbation par le ministre (étude) ou le wali (notice).'
