sections:
- heading: 'Étude ou notice : deux sources à consulter'
  paragraphs:
  - 'L''article 3 du décret pose la règle : sont soumis à étude ou à notice d''impact, d''une part les installations classées pour lesquelles la nomenclature du décret 07-144 l''exige (la nomenclature comporte une colonne « étude d''impact » et une colonne « notice d''impact » pour chaque rubrique), d''autre part les projets listés en annexes du décret 07-145. Ces annexes ont été entièrement remplacées par le décret 19-241 de 2019.'
  list:
  - 'Annexe I (étude d''impact), exemples tirés du texte : aménagements touristiques de 10 hectares et plus, autoroutes, aéroports, ports, barrages, entrepôts et centres de distribution de 20 000 m² et plus, aménagements en zone humide, pipelines d''hydrocarbures, exploration ou extraction de pétrole, de gaz ou de minéraux, lignes de chemin de fer, hôpitaux de 500 lits et plus, parcs éoliens de plus de 20 MW, centrales solaires de plus de 20 MW.'
  - 'Annexe II (notice d''impact), exemples : aménagement de zones d''activités et de zones industrielles, parkings de plus de 100 voitures, lignes électriques de plus de 30 kV, adductions d''eau pour plus de 10 000 habitants, centres commerciaux de 5 000 m² et plus, hôpitaux de 60 à 500 lits.'
  after: 'Une usine, une cimenterie ou un dépôt d''hydrocarbures ne figurent pas dans ces annexes : leur obligation d''étude d''impact vient de la nomenclature des installations classées. Le classement se vérifie donc toujours rubrique par rubrique.'
- heading: Contenu du rapport (article 6, rédaction 2018)
  paragraphs: []
  list:
  - présentation du promoteur et du bureau d'études, avec copie de la décision d'agrément délivrée par le ministre chargé de l'environnement ;
  - analyse des alternatives et variantes du projet, en fondant les choix retenus aux plans économique, technologique et environnemental ;
  - délimitation de la zone d'étude selon le rayon d'affichage de la nomenclature (installations classées) ou dans un rayon de 3 km au plus (projets des annexes) ;
  - description détaillée de l'état initial du site (ressources naturelles, biodiversité, espaces terrestres, maritimes ou hydrauliques, qualité de l'air), avec plan de situation au 1/2 500 et plan de masse au 1/200 ;
  - description des phases du projet (construction, exploitation, post-exploitation) et estimation des résidus, émissions et nuisances ;
  - évaluation des impacts prévisibles, directs et indirects, à court, moyen et long terme, et effets cumulatifs ;
  - mesures envisagées pour supprimer, réduire ou compenser les conséquences dommageables, avec leurs incidences financières ;
  - plan de gestion de l'environnement détaillé, avec planning d'exécution ;
  - rapport descriptif du projet, établi par le bureau d'études et mis à la disposition du public pendant l'enquête.
  after: L'étude est établie par un bureau d'études agréé par le ministre chargé de l'environnement (article 4, renvoyant à l'article 22 de la loi 03-10 ; conditions d'agrément fixées par le décret 23-324).
- heading: Procédure et délais réglementaires
  paragraphs: []
  list:
  - dépôt par le promoteur auprès du wali territorialement compétent, en quatorze exemplaires papier et deux exemplaires numériques (article 7) ;
  - examen du contenu par les services chargés de l'environnement, saisis par le wali, dans un délai d'un mois ; compléments à fournir sous deux mois, faute de quoi l'étude est rejetée sauf demande de prorogation motivée (article 8) ;
  - après examen préliminaire et acceptation, ouverture de l'enquête publique par arrêté du wali ; les projets situés dans des zones industrielles, zones d'activités, zones portuaires, zones sous douane et les projets en mer déjà soumis à enquête publique en sont dispensés (article 9) ;
  - 'affichage de l''arrêté au siège de la wilaya, des communes concernées et sur le site, et insertion dans deux quotidiens nationaux aux frais du promoteur ; durée de l''enquête : quinze jours au plus à compter de l''affichage ; registre coté et paraphé (article 10) ;'
  - commissaire enquêteur désigné par le wali, qui veille à l'affichage, au registre et aux vérifications complémentaires, puis remet un procès-verbal (articles 12 à 14) ;
  - avis des services techniques saisis dès l'ouverture de l'enquête, dans un délai d'un mois ; après un rappel, le silence vaut avis favorable (article 17) ;
  - mémoire en réponse du promoteur aux avis recueillis, dans un délai de dix jours (article 15) ;
  - transmission du dossier complet au ministre chargé de l'environnement pour l'étude d'impact, ou aux services de l'environnement pour la notice (article 16) ;
  - approbation de l'étude d'impact par le ministre chargé de l'environnement et de la notice par le wali ; rejet motivé ; notification par le wali (article 18) ;
  - en cas de rejet, recours administratif auprès du ministre chargé de l'environnement, sans préjudice des recours juridictionnels (article 19).
  after: ''
- heading: Trois règles à ne pas oublier
  paragraphs: []
  list:
  - aucun travail de construction ne peut être engagé avant l'approbation de l'étude ou de la notice (article 21) ;
  - toute modification de la dimension des installations, de la capacité ou des procédés après le dépôt impose une nouvelle étude ou notice (article 5) ;
  - l'approbation de l'étude relative à l'extension d'un projet ne se substitue pas à l'autorisation d'exploitation de l'établissement existant (article 5, alinéa ajouté en 2018).
  after: ''
- heading: Délais à prévoir en pratique
  paragraphs:
  - 'Depuis 2018, le décret ne fixe plus de délai global de décision après l''enquête ; il encadre chaque étape : un mois d''examen, deux mois pour les compléments, quinze jours d''enquête, un mois pour les avis des services, dix jours pour le mémoire. En pratique, comptez de deux à six mois selon la wilaya et la qualité du dossier, hors durée de réalisation de l''étude elle-même. Les demandes de compléments sont la première cause de dérive, et elles se préviennent au moment de la rédaction.'
  list: []
  after: ''
faq:
- q: Peut-on démarrer les travaux pendant l'instruction ?
  a: 'Non. L''article 21 l''interdit : aucun travail de construction ne peut être engagé avant l''approbation de l''étude ou de la notice d''impact.'
- q: Qui peut réaliser l'étude d'impact ?
  a: Un bureau d'études agréé par le ministre chargé de l'environnement (article 4). Depuis 2018, la copie de la décision d'agrément fait partie du contenu obligatoire de l'étude. BTH Expert dispose de cet agrément.
- q: L'étude est-elle rendue publique ?
  a: 'Oui, pendant l''enquête publique : l''arrêté est affiché et publié dans deux quotidiens nationaux, un rapport descriptif du projet est mis à la disposition du public, et toute personne peut demander à consulter l''étude et dispose alors de quinze jours pour formuler ses observations (article 11).'
- q: Les projets d'hydrocarbures suivent-ils la même procédure ?
  a: Non. Les études d'impact des activités relevant du domaine des hydrocarbures demeurent régies par le décret exécutif 08-312 du 5 octobre 2008 (article 11 du décret 18-255), et les bureaux d'études doivent en outre être pré-qualifiés par l'Autorité de régulation des hydrocarbures (décret exécutif 24-278 du 13 août 2024).
