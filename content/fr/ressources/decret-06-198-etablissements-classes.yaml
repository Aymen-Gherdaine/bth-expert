title: Établissements classés pour la protection de l'environnement
officialTitle: Décret exécutif n° 06-198 du 31 mai 2006 définissant la réglementation applicable aux établissements classés pour la protection de l'environnement (JO n° 37 du 4 juin 2006), modifié et complété par le décret exécutif n° 22-167 du 19 avril 2022 (JO n° 29 du 24 avril 2022)
summary: 'Le régime d''autorisation des établissements classés : quatre catégories et trois autorités, un accord préalable de création avant les travaux, une visite de conformité avant l''autorisation d''exploitation, et l''étude de dangers qui conditionne l''ouverture.'
homeLine: Conditionne l'autorisation d'exploitation d'un établissement classé à une étude d'impact approuvée et à une étude de dangers approuvée, à un accord préalable de création et à une visite de conformité, selon quatre catégories et trois autorités.
meta:
- label: Catégories
  value: 1re à 4e
- label: Autorités
  value: Ministre · Wali ou wali délégué · Président d'APC
- label: Accord préalable
  value: 15 jours après le dépôt
sections:
- heading: Quatre catégories, trois autorités (article 3)
  paragraphs: []
  list:
  - '1re catégorie : établissement comportant au moins une installation soumise à autorisation ministérielle ; l''autorisation d''exploitation est délivrée par arrêté conjoint du ministre chargé de l''environnement et du ministre concerné (article 20) ;'
  - '2e catégorie : au moins une installation soumise à autorisation du wali ou du wali délégué territorialement compétent (rédaction 2022) ;'
  - '3e catégorie : au moins une installation soumise à autorisation du président de l''assemblée populaire communale ;'
  - '4e catégorie : au moins une installation soumise au régime de la déclaration auprès du président de l''APC, déposée soixante jours au moins avant la mise en exploitation (article 24).'
  after: Le régime de chaque installation (AM, AW, APAPC ou D) est indiqué, rubrique par rubrique, dans la nomenclature du décret 07-144.
- heading: Ce qui précède toute demande (article 5)
  paragraphs:
  - 'Toute demande d''autorisation d''exploitation est précédée, selon la nomenclature :'
  list:
  - d'une étude ou d'une notice d'impact établie et approuvée dans les conditions du décret 07-145 ;
  - d'une étude de danger établie et approuvée dans les conditions du décret 06-198 ;
  - d'une enquête publique.
  after: ''
- heading: Le dossier et la procédure (articles 6 à 8, rédaction 2022)
  paragraphs: []
  list:
  - dépôt de la demande auprès du wali, accompagnée des études approuvées ;
  - examen préliminaire du dossier par la commission de wilaya de contrôle des établissements classés ;
  - 'décision d''accord préalable de création de l''établissement classé dans un délai de quinze jours à compter du dépôt : établie par les services de l''environnement et délivrée par le ministre chargé de l''environnement (1re catégorie) ou par le wali, le cas échéant le wali délégué (2e et 3e catégories), puis notifiée au promoteur ; elle transcrit les prescriptions des décisions d''approbation de l''étude d''impact et de l''étude de danger (articles 16 et 17) ;'
  - aucun travail de construction ne peut être engagé avant l'obtention de l'accord préalable (article 18) ;
  - à l'issue des travaux, visite de la commission sur site et procès-verbal de conformité (article 19) ;
  - délivrance de l'autorisation d'exploitation dans un délai de trois mois à compter de la demande du promoteur à la fin des travaux ; l'arrêté fixe les prescriptions techniques spécifiques (articles 20 et 21).
  after: Le dossier comprend l'identité du promoteur, la nature et le volume des activités avec les rubriques de la nomenclature, les procédés, matières et produits, une carte au 1/25 000 ou 1/50 000, un plan de situation au 1/2 500 au moins jusqu'au dixième du rayon d'affichage (100 m minimum), un plan d'ensemble au 1/200 au moins jusqu'à 35 m, un rapport sur les produits dangereux et un rapport sur les eaux résiduaires, les émanations et les déchets (articles 8 et 9).
- heading: L'étude de danger (articles 12 à 15)
  paragraphs:
  - Elle précise les risques directs ou indirects par lesquels l'activité met en danger les personnes, les biens et l'environnement, que la cause soit interne ou externe, et définit les mesures techniques propres à réduire la probabilité et les effets des accidents ainsi que les mesures d'organisation pour leur prévention et leur gestion. Elle est réalisée aux frais du promoteur par un bureau d'études agréé par le ministre chargé de l'environnement.
  list:
  - présentation générale du projet ;
  - 'description de l''environnement immédiat et du voisinage potentiellement affecté : données physiques (géologie, hydrologie, météorologie, sismicité) et socio-économiques (population, habitat, points d''eau, voies de communication, aires protégées) ;'
  - description du projet et de ses installations, produits et matières, avec plans ;
  - identification de tous les facteurs de risques, intrinsèques et extrinsèques ;
  - 'analyse des risques et des conséquences : événements accidentels, cotation en gravité et probabilité, méthode d''évaluation utilisée ;'
  - analyse des impacts potentiels en cas d'accident sur les populations, l'environnement et l'économie ;
  - organisation de la sécurité du site, prévention des accidents majeurs, système de gestion de la sécurité et moyens de secours.
  after: 'Ses modalités d''examen et d''approbation sont fixées par l''arrêté interministériel du 14 septembre 2014 (JO n° 3 du 27 janvier 2015) : dépôt auprès du wali en huit exemplaires, transmission sous cinq jours à la commission interministérielle (1re catégorie) ou à la commission de wilaya (2e catégorie), demande de compléments possible dans les quarante-cinq jours de la saisine, quinze jours laissés au promoteur pour y répondre, décision d''approbation ou de rejet signée conjointement par les ministres chargés de l''intérieur et de l''environnement (1re catégorie) ou par le wali (2e catégorie), notifiée par le wali.'
- heading: Contrôle, modifications et établissements existants
  paragraphs: []
  list:
  - en cas de non-conformité constatée, procès-verbal et délai de régularisation ; à défaut, suspension de l'autorisation, puis retrait si la mise en conformité n'est pas faite dans les six mois (article 23) ;
  - toute conversion d'activité, changement de procédé, transformation des équipements, extension ou transfert impose une nouvelle demande d'autorisation ou une nouvelle déclaration (articles 38 et 39) ;
  - un établissement existant sans autorisation devait régulariser sa situation dans l'année suivant le décret de 2022 ; sa demande est précédée de l'approbation d'un audit environnemental et de l'étude de danger, le dossier est déposé en deux exemplaires papier et quatorze supports électroniques, la commission visite le site sous dix jours (articles 44 et 44 bis).
  after: ''
faq:
- q: Un atelier existant doit-il demander une autorisation ?
  a: Oui, si son activité figure dans la nomenclature. Depuis 2022, la régularisation d'un établissement existant passe d'abord par l'approbation d'un audit environnemental et d'une étude de danger, puis par une visite de conformité de la commission de wilaya (article 44 bis).
- q: Quelle différence entre étude d'impact et étude de danger ?
  a: L'étude d'impact traite des effets de l'installation sur l'environnement en fonctionnement normal (décret 07-145). L'étude de danger traite des risques d'accident et de leur maîtrise (articles 12 à 15 du décret 06-198). Les deux, approuvées, précèdent la demande d'autorisation d'exploitation (article 5).
- q: Quand peut-on commencer les travaux ?
  a: Après la décision d'accord préalable de création, délivrée dans les quinze jours suivant le dépôt du dossier complet (articles 6 et 18). L'autorisation d'exploitation, elle, n'est délivrée qu'après la visite de conformité à la fin des travaux (article 19).
