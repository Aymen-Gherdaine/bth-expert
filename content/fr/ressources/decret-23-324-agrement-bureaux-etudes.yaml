sections:
- heading: Ce que le décret exige
  paragraphs: []
  list:
  - l'activité de bureau d'études en environnement est soumise à un agrément délivré par arrêté du ministre chargé de l'environnement, après avis d'une commission ministérielle ;
  - le bureau doit être de nationalité algérienne ou de droit algérien, son responsable titulaire d'un diplôme universitaire dans l'une des spécialités de l'annexe du décret, avec une expérience professionnelle d'au moins trois ans dans le domaine ;
  - l'agrément est accordé pour cinq ans renouvelables ; la demande de renouvellement se dépose au moins quarante-cinq jours avant l'expiration ;
  - tout changement dans la situation du bureau donne lieu à un arrêté modificatif ; les bureaux existants disposaient de douze mois à compter de la publication pour se conformer.
  after: ''
- heading: Pourquoi cela vous concerne
  paragraphs:
  - Les décrets 07-145 et 06-198 et l'arrêté interministériel du 14 septembre 2014 exigent que l'étude d'impact et l'étude de dangers soient établies par un bureau agréé. Une étude signée par un bureau sans agrément valide, ou dont l'agrément ne couvre pas le type d'étude, est rejetée à la recevabilité. Avant toute commande, demandez l'arrêté d'agrément et vérifiez sa date de validité.
  - 'Pour les activités du secteur des hydrocarbures, l''agrément environnemental ne suffit pas : le bureau doit en outre être pré-qualifié par l''Autorité de régulation des hydrocarbures.'
  list: []
  after: ''
faq:
- q: BTH Expert est-il agréé ?
  a: Oui. BTH Expert est agréé par le ministère chargé de l'environnement pour la réalisation des études d'impact et des études de dangers. L'arrêté d'agrément est communiqué sur demande.
- q: Un bureau étranger peut-il réaliser une étude d'impact en Algérie ?
  a: L'agrément est réservé aux personnes physiques de nationalité algérienne et aux personnes morales de droit algérien. Un bureau étranger intervient, le cas échéant, en appui d'un bureau algérien agréé.
