title: Agrément des bureaux d'études en environnement
officialTitle: Décret exécutif n° 23-324 du 6 septembre 2023 fixant les conditions et les modalités d'exercice de l'activité des bureaux d'études dans le domaine de l'environnement (JO n° 61 du 17 septembre 2023)
summary: 'Le texte qui dit qui a le droit de réaliser vos études d''impact, de dangers et d''audit : un bureau agréé par arrêté du ministre chargé de l''environnement, pour cinq ans renouvelables. Une étude signée par un bureau non agréé est irrecevable.'
homeLine: Réserve la réalisation des études d'impact, de dangers et des audits aux bureaux agréés par arrêté du ministre chargé de l'environnement, pour cinq ans renouvelables.
