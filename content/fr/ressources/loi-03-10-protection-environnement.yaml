title: Protection de l'environnement dans le cadre du développement durable
officialTitle: Loi n° 03-10 du 19 juillet 2003 relative à la protection de l'environnement dans le cadre du développement durable, publiée au Journal officiel n° 43 du 20 juillet 2003, modifiée et complétée
summary: La loi-cadre de l'environnement en Algérie. Elle fixe les principes (article 3), soumet les projets à étude ou notice d'impact (articles 15 et 16), définit les établissements classés et leurs régimes d'autorisation (articles 18 à 25) et réserve les études aux bureaux agréés (article 22).
homeLine: 'Le texte fondateur : tout projet susceptible d''affecter l''environnement est soumis à une étude ou à une notice d''impact (art. 15), et les établissements classés à autorisation ou déclaration (art. 19).'
