title: Protection de l'environnement dans le cadre du développement durable
officialTitle: Loi n° 03-10 du 19 juillet 2003 relative à la protection de l'environnement dans le cadre du développement durable (JO n° 43 du 20 juillet 2003), modifiée et complétée
summary: La loi-cadre de l'environnement en Algérie. Elle pose les principes directeurs, crée l'obligation d'étude ou de notice d'impact pour tout projet susceptible d'affecter l'environnement, et organise le régime des établissements classés.
homeLine: 'Le texte fondateur : tout projet susceptible d''affecter l''environnement est soumis à une étude ou à une notice d''impact préalable, et les établissements classés à autorisation ou déclaration.'
