sections:
- heading: Ce qui change par rapport à la loi 04-20
  paragraphs:
  - 'La loi 24-04 reprend et élargit le dispositif de 2004 : elle traite de la prévention, de l''intervention et de la réduction des risques de catastrophes, qu''ils soient naturels, technologiques ou sanitaires. Pour un exploitant industriel, l''essentiel est inchangé dans son principe et précisé dans ses modalités : analyser les risques de son installation, les réduire à la source et organiser la réponse en cas d''accident.'
  - Les textes antérieurs qui citent encore la loi 04-20 (études de dangers, plans d'intervention établis avant 2024) doivent être lus à la lumière du nouveau cadre.
  list: []
  after: ''
- heading: Les plans d'intervention
  paragraphs:
  - 'Le décret exécutif 25-63 du 28 janvier 2025 (JO n° 7 du 5 février 2025), pris en application des articles 73 et 76 de la loi, fixe les conditions d''élaboration, de mise en œuvre et de gestion de deux plans :'
  list:
  - 'le plan interne d''intervention (PII), établi par l''exploitant : mesures de prévention, d''organisation et de coordination des secours en cas d''accident ayant des effets sur l''installation ;'
  - le plan particulier d'intervention (PPI), établi par les pouvoirs publics pour les établissements classés dont l'étude de dangers conclut que les effets des risques peuvent dépasser les limites de l'installation.
  after: Le décret prévoit des exercices de simulation et le déclenchement du plan particulier lorsque les moyens du plan interne se révèlent insuffisants.
- heading: Obligations de l'exploitant
  paragraphs: []
  list:
  - identifier et analyser les risques que présente l'installation ;
  - mettre en œuvre les mesures de prévention et de réduction à la source ;
  - établir et tenir à jour un plan interne d'intervention, et s'exercer à sa mise en œuvre ;
  - informer les autorités et s'inscrire dans les plans d'organisation des secours.
  after: ''
- heading: Lien avec l'étude de dangers
  paragraphs:
  - 'Pour un site industriel, l''étude de dangers est l''outil qui matérialise ces obligations : scénarios d''accident, zones d''effet, mesures de maîtrise des risques. Elle constitue la base technique du plan interne d''intervention et détermine si un plan particulier d''intervention est nécessaire.'
  list: []
  after: ''
faq:
- q: Plan interne d'intervention et étude de dangers, est-ce la même chose ?
  a: Non. L'étude de dangers analyse les risques ; le plan interne d'intervention organise la réponse de l'exploitant en cas d'accident. Le second s'appuie sur la première.
- q: Un plan interne établi sous l'ancien décret 09-335 reste-t-il valable ?
  a: Le décret 25-63 encadre désormais les plans internes et particuliers d'intervention. Un plan existant doit être confronté à ses exigences et mis à jour si nécessaire ; nous mesurons l'écart au cas par cas.
