title: Prévention, intervention et réduction des risques de catastrophes
officialTitle: Loi n° 24-04 du 26 février 2024 portant les règles de prévention, d'intervention et de réduction des risques de catastrophes dans le cadre du développement durable (JO n° 16 du 6 mars 2024), qui abroge la loi n° 04-20 du 25 décembre 2004
summary: La loi qui remplace depuis 2024 l'ancienne loi 04-20 sur les risques majeurs. Elle organise la prévention des risques de catastrophes, dont les risques industriels, et impose aux exploitants d'installations dangereuses des plans d'intervention, précisés par le décret 25-63 de 2025.
homeLine: 'Remplace la loi 04-20 depuis 2024 : impose aux exploitants d''installations à risque la maîtrise des scénarios d''accident et des plans internes et particuliers d''intervention (décret 25-63 de 2025).'
