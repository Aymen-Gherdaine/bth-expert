title: Prévention, intervention et réduction des risques de catastrophes
officialTitle: 'Loi n° 24-04 du 26 février 2024 portant les règles de prévention, d''intervention et de réduction des risques de catastrophes dans le cadre du développement durable (JO n° 16 du 6 mars 2024), qui abroge la loi n° 04-20 du 25 décembre 2004 ; texte d''application : décret exécutif n° 25-63 du 28 janvier 2025 (JO n° 7 du 5 février 2025)'
summary: La loi qui remplace depuis 2024 l'ancienne loi 04-20 sur les risques majeurs. Pour un exploitant industriel, elle impose une étude de vulnérabilité avant mise en place (article 75) et un plan interne d'intervention (article 76), précisés par le décret 25-63 de 2025, qui abroge les anciens décrets sur les plans d'intervention.
homeLine: 'Remplace la loi 04-20 depuis 2024 : toute installation industrielle est soumise à une étude de vulnérabilité (art. 75) et à un plan interne d''intervention (art. 76), encadrés par le décret 25-63 de 2025.'
