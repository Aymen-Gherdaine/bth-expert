sections:
- heading: Les risques couverts (article 3)
  paragraphs: []
  list:
  - risques sismiques, géologiques, d'inondations, climatiques extrêmes, d'incendies de forêt ;
  - risques industriels et énergétiques ;
  - risques spatiaux, radiologiques et nucléaires ;
  - risques affectant la santé humaine, animale et végétale ; risques de pollution atmosphérique, marine et hydrique ;
  - risques des regroupements humains importants, de désertification, de sécheresse, d'érosion du littoral et d'élévation du niveau de la mer.
  after: ''
- heading: Obligations de l'exploitant industriel (articles 73 à 76)
  paragraphs: []
  list:
  - 'article 75 : toute installation industrielle doit, avant sa mise en place et son exploitation, être soumise à une étude de vulnérabilité aux risques de catastrophes ;'
  - 'article 76 : les exploitants d''installations industrielles et de lignes de transport d''hydrocarbures par canalisation doivent élaborer un plan interne d''intervention définissant les mesures de prévention, les systèmes d''alarme et d''alerte, les études techniques, les moyens mobilisés et les procédures à mettre en œuvre en cas de catastrophe ;'
  - 'articles 73 et 74 : des plans particuliers d''intervention, établis par voie réglementaire, protègent les installations industrielles et les structures ; ils analysent les risques, prévoient les dispositifs d''alerte et informent les citoyens.'
  after: ''
- heading: 'Le décret 25-63 : plans particulier et interne d''intervention'
  paragraphs:
  - Pris en application des articles 73 et 76, il fixe les conditions d'élaboration, de mise en œuvre et de gestion des deux plans et abroge les décrets 15-71 (plans particuliers) et 09-335 (plans internes) (article 29).
  list:
  - 'plan particulier d''intervention : pour les établissements classés dont l''étude de danger conclut que les effets des risques peuvent dépasser les limites de l''installation, les ouvrages hydrauliques, les canalisations d''hydrocarbures et de gaz et les installations d''hydrocarbures ; la liste est fixée par arrêté du wali (articles 2 à 6) ;'
  - 'plan interne d''intervention : pour les installations industrielles et canalisations qui, par danger d''incendie, d''explosion ou d''émanation toxique, peuvent créer des risques pour les travailleurs, la population, les biens et l''environnement (articles 7 et 8) ;'
  - les plans sont élaborés à la charge de l'exploitant, sur la base d'une étude de vulnérabilité (plan particulier) ou d'une étude de danger (plan interne), par des bureaux d'études agréés par l'État, selon un canevas fixé par arrêté conjoint (articles 10 à 12) ;
  - approbation par une commission de wilaya présidée par le wali, qui statue dans les trois mois, faute de quoi le projet est réputé recevable (articles 14 et 15) ;
  - 'exercices de simulation : programme annuel pour le plan particulier, au moins deux exercices par an pour le plan interne (article 24) ; actualisation après tout accident, exercice ou modification de l''installation (article 26) ;'
  - les installations en fonctionnement avaient un an pour se conformer ; une installation nouvelle ne peut exploiter qu'après approbation de ses plans (article 28).
  after: ''
- heading: Lien avec l'étude de danger
  paragraphs:
  - Pour un site industriel, l'étude de danger du décret 06-198 est la base technique du plan interne d'intervention et détermine si un plan particulier d'intervention est nécessaire. Une étude de danger bien dimensionnée fait donc gagner la procédure suivante.
  list: []
  after: ''
faq:
- q: Plan interne d'intervention et étude de danger, est-ce la même chose ?
  a: Non. L'étude de danger analyse les risques et leurs conséquences ; le plan interne d'intervention fixe la planification et la gestion des interventions et des secours à l'intérieur de l'installation en cas d'accident (article 7 du décret 25-63). Le second s'appuie sur la première.
- q: Un plan interne établi sous l'ancien décret 09-335 reste-t-il valable ?
  a: Le décret 25-63 abroge le décret 09-335 et imposait aux installations en fonctionnement de se conformer à ses dispositions dans un délai d'un an (articles 28 et 29). Un plan existant doit donc être revu selon le nouveau canevas et approuvé par la commission de wilaya.
