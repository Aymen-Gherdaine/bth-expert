faq:
  heading: Questions fréquentes
  items:
    - q: Quels projets nécessitent une étude d'impact en Algérie ?
      a: "Deux sources le disent : la nomenclature des installations classées (décret exécutif 07-144), qui indique rubrique par rubrique si une étude ou une notice d'impact est exigée, et les listes annexées au décret 07-145 (révisées en 2019) pour les autres projets, comme les infrastructures, les aménagements ou l'énergie. Dans les deux cas, l'étude doit être approuvée avant toute autorisation de construire ou d'exploiter."
    - q: Quel est le délai moyen pour obtenir une autorisation environnementale ?
      a: "Les textes encadrent chaque étape : un mois d'examen par les services de l'environnement, quinze jours d'enquête publique, un mois pour l'avis des services techniques, dix jours pour le mémoire en réponse. En pratique, comptez 2 à 6 mois selon le projet et la wilaya, hors durée de réalisation de l'étude elle-même."
    - q: BTH Expert intervient-il hors d'Oran ?
      a: 'Oui. Basé à Oran, nous intervenons dans toute l''Algérie, avec une concentration sur l''Ouest algérien : Oran, Mostaganem, Tlemcen, Sidi Bel Abbès, Relizane et les wilayas limitrophes.'
    - q: Qu'est-ce qu'un agrément Ministère de l'Environnement ?
      a: C'est un agrément délivré par arrêté du ministre chargé de l'environnement, dans les conditions du décret exécutif 23-324 du 6 septembre 2023, pour cinq ans renouvelables. Seul un bureau agréé peut réaliser une étude d'impact ou une étude de dangers recevable. BTH Expert est agréé.
    - q: Combien coûte une étude environnementale ?
      a: Le coût dépend du type d'étude, de l'ampleur du projet et de sa localisation. Nous établissons un devis personnalisé après une consultation initiale gratuite. Contactez-nous pour en discuter.
